<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b2545">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Boat Bingo">
    <title>Boat Bingo</title>
    <meta name="description" content="Get 5 stupid questions in a row and you win! A bingo game for all the boat workers out there.">

    <!-- Link preview (iMessage, Slack, Facebook, etc.). Image URL must be absolute. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mdemichele.github.io/boat-bingo/">
    <meta property="og:title" content="Boat Bingo ⛵">
    <meta property="og:description" content="Get 5 stupid questions in a row and you win!">
    <meta property="og:image" content="https://mdemichele.github.io/boat-bingo/thumbnail.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Boat Bingo title next to a bingo board of boat questions">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lilita+One&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">

      <!-- Title -->
      <header class="page-header">
        <h1 class="page-title">Boat Bingo <span aria-hidden="true">⛵</span></h1>
        <p class="page-subtitle">Get 5 stupid questions in a row and you win!</p>
      </header>

      <!-- Setup -->
      <section class="card setup-card" aria-label="Build your board">

        <!-- Form -->
        <form id="question-form" class="question-form" autocomplete="off">
          <label class="form-label" for="form-question">Enter your dumbass question</label>
          <div class="form-line">
            <input id="form-question" class="form-input" type="text" name="question"
                   placeholder="e.g. Will we see turtles?" maxlength="80"
                   autocapitalize="sentences" enterkeyhint="send">
            <button class="button button-primary" type="submit">Add</button>
          </div>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>

        <!-- Question count -->
        <div class="progress">
          <div class="progress-text">
            <span id="question-count">25 more questions to go...</span>
            <button id="undo-question" class="link-button" type="button" hidden>Undo last</button>
          </div>
          <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>

        <!-- Board buttons -->
        <div class="button-row">
          <button id="classic-mode" class="button button-light" type="button">Play Classic Board 🤘</button>
          <button id="refresh" class="button button-danger" type="button">Clear Board 🚫</button>
        </div>

        <!-- Game Mode selection -->
        <fieldset class="mode-fieldset">
          <legend class="form-label">Game mode</legend>
          <div class="segmented">
            <input id="bingo-mode" type="radio" name="game-mode" value="bingo-mode" checked>
            <label for="bingo-mode">Bingo <small>5 in a row</small></label>
            <input id="blackout-mode" type="radio" name="game-mode" value="blackout-mode">
            <label for="blackout-mode">Blackout <small>Fill the card</small></label>
          </div>
        </fieldset>

        <!-- Play Game Button -->
        <button id="play-game" class="button button-play" type="button" hidden>Play Game ⬇️</button>
      </section>

      <!-- Board Section -->
      <section id="board-section" class="board-section" aria-label="Bingo board">
        <div class="board-toolbar">
          <span id="mode-badge" class="mode-badge">Bingo</span>
          <button id="clear-marks" class="link-button" type="button">Clear marks</button>
        </div>
        <!-- Squares are generated in functions.js -->
        <div id="bingo-board" class="bingo-board"></div>
      </section>

    </main>

    <!-- Winner popup -->
    <dialog id="win-dialog" class="popup">
      <p class="popup-emoji" aria-hidden="true">🎉</p>
      <h2 id="win-title" class="popup-title">Bingo!</h2>
      <p id="win-message" class="popup-message"></p>
      <form method="dialog" class="button-row">
        <button class="button button-light" value="keep">Keep playing</button>
        <button class="button button-primary" value="new">New round</button>
      </form>
    </dialog>

    <!-- Confirm popup (text is filled in by showConfirmDialog in functions.js) -->
    <dialog id="confirm-dialog" class="popup">
      <p id="confirm-emoji" class="popup-emoji" aria-hidden="true"></p>
      <h2 id="confirm-title" class="popup-title"></h2>
      <p id="confirm-message" class="popup-message"></p>
      <form method="dialog" class="button-row">
        <button class="button button-light" value="cancel">Cancel</button>
        <button id="confirm-button" class="button" value="confirm"></button>
      </form>
    </dialog>

    <script src="functions.js"></script>
  </body>
</html>
